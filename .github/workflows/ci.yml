name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  # PDF-generering bruges ikke i CI, så Chromium skal ikke hentes (sparer ~1 min)
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # npm ci fejler hvis package-lock.json ikke matcher package.json
      - run: npm ci
      - name: Syntakstjek af alle filer i src/
        run: find src server.js -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: npx vitest run

  smoke:
    name: Smoke test (server + MongoDB)
    runs-on: ubuntu-latest
    needs: test
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGO_URI: mongodb://localhost:27017/sds-ci
      SESSION_SECRET: ci-only-secret
      PORT: 3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Start server
        run: |
          node server.js > server.log 2>&1 &
          echo $! > server.pid
      - name: Vent på at serveren svarer
        run: |
          for i in $(seq 1 30); do
            if curl -fs -o /dev/null http://localhost:3000/login; then
              echo "Serveren er oppe efter ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Serveren svarede ikke inden for 30s"
          exit 1
      - name: Tjek centrale routes
        run: |
          check() {
            local path=$1 expected=$2
            local status
            status=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$path")
            if [ "$status" != "$expected" ]; then
              echo "FEJL: $path gav $status, forventede $expected"
              exit 1
            fi
            echo "OK: $path -> $status"
          }
          check /login 200
          # Beskyttede sider skal sende ikke-loggede brugere videre (ikke crashe med 500)
          check / 302
          check /admin 302
      - name: Server-log
        if: always()
        run: cat server.log || true

  audit:
    name: Sikkerhedsaudit (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Kun produktionsafhængigheder; fejler på high/critical
      - run: npm audit --omit=dev --audit-level=high
